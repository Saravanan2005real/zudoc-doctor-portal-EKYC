services:
  backend_api:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    ports:
      - "8085:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=secretpassword
      - DB_NAME=doctor_verification_db
      - REDIS_HOST=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=production-jwt-secret-key-doctor-verification-portal
      - SMS_PROVIDER=MOCK
      - PORT=8080
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - rabbitmq

  ocr_engine:
    build:
      context: ./ocr_engine
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./ocr_uploads:/app/ocr_uploads

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=doctor_verification_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
      - "8082:8082"
      - "8084:8084"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend_portal:/usr/share/nginx/html/frontend_portal:ro
      - ./b2b_portal:/usr/share/nginx/html/b2b_portal:ro
      - ./customer_portal:/usr/share/nginx/html/customer_portal:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - ./ocr_uploads:/usr/share/nginx/html/ocr_uploads:ro
    depends_on:
      - backend_api
      - ocr_engine

volumes:
  postgres_data:
