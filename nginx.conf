events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream backend_api {
        server backend_api:8080;
    }

    server {
        listen 80;
        client_max_body_size 15M;

        # Serve frontend portal static files
        location / {
            root /usr/share/nginx/html/frontend_portal;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Serve static uploads
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            autoindex off;
        }

        location /ocr_uploads/ {
            alias /usr/share/nginx/html/ocr_uploads/;
            autoindex off;
        }

        # API Proxy
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health/ {
            proxy_pass http://backend_api/health/;
        }

        location /metrics {
            proxy_pass http://backend_api/metrics;
        }
    }
    server {
        listen 8082;

        location / {
            root /usr/share/nginx/html/b2b_portal;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API Proxy for B2B Portal
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 8084;
        client_max_body_size 15M;

        location / {
            root /usr/share/nginx/html/customer_portal;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Serve extracted face images and processed documents
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            autoindex off;
        }

        location /ocr_uploads/ {
            alias /usr/share/nginx/html/ocr_uploads/;
            autoindex off;
        }

        # API Proxy for Customer Portal
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
