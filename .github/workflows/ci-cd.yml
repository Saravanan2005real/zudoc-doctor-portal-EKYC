name: CI/CD Pipeline - Doctor Verification Service

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Python Syntax & Import Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      working-directory: python_backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt Pillow

    - name: Compile Python backend
      working-directory: python_backend
      run: python -m compileall -q .

    - name: Compile OCR service
      working-directory: ocr_service
      run: python -m compileall -q app.py

  docker-build:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: doctor-service:${{ github.sha }}
