<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuDoc eKYC API - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">ZuDoc API <span style="font-size: 1rem; color: var(--text-muted); font-weight: 500;">Admin</span></a>
        <div class="nav-links">
            <a href="/">Back to Portal</a>
        </div>
    </nav>

    <div class="admin-header">
        <div>
            <h2>Company Verification Requests</h2>
            <p style="color: var(--text-muted);">Review and approve access to the eKYC API.</p>
        </div>
        <button class="btn btn-outline" onclick="loadRequests()">Refresh</button>
    </div>

    <div class="dashboard-grid" id="requests-grid">
        <!-- Cards will be injected here via JS -->
    </div>

    <!-- Modal for showing API Key -->
    <div id="apiKeyModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); z-index:1000; justify-content:center; align-items:center;">
        <div class="container" style="margin:0; text-align:center;">
            <h3 style="color:var(--success); margin-top:0;">Access Approved!</h3>
            <p style="color:var(--text-muted); margin-bottom: 24px;">Company and User successfully created.</p>
            
            <div style="background:rgba(0,0,0,0.4); border:1px solid var(--border-color); border-radius:8px; padding:16px; margin-bottom:24px;">
                <p style="margin:0; font-size:0.9rem; color:var(--text-muted); margin-bottom:8px;">Generated API Key (LIVE)</p>
                <code id="modalApiKey" style="color:#a5b4fc; font-size:1.1rem; word-break:break-all;">sk_live_...</code>
            </div>
            
            <button class="btn" onclick="document.getElementById('apiKeyModal').style.display='none'">Close</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
