<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifyyy - Demo Eye Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .demo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .btn-start {
            background: var(--accent-color, #2dd4bf);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        #webgazerVideoContainer,
        #webgazerVideoFeed,
        #webgazerVideoCanvas,
        #webgazerFaceOverlay,
        #webgazerFaceFeedbackBox {
            position: fixed !important;
            top: -9999px !important;
            left: -9999px !important;
            width: 320px !important;
            height: 240px !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            z-index: -9999 !important;
            border: none !important;
            box-shadow: none !important;
            overflow: hidden !important;
        }
        .cal-dot {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ef4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 999;
            border: none;
            outline: none;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            transition: transform 0.2s, background 0.2s;
        }
        .cal-dot:hover {
            transform: translate(-50%, -50%) scale(1.2);
            background: #f87171;
        }
        .cal-done {
            background: #10b981 !important;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .cal-hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 999;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #gazeReticle {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 3px solid #2dd4bf;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
            display: none;
            transition: left 0.1s, top 0.1s;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="intro-card" class="demo-container">
        <h2 style="margin-bottom: 16px;">Demo: Eye Tracking Liveness</h2>
        <p style="color: #94a3b8; margin-bottom: 24px; max-width: 400px; line-height: 1.5;">
            Follow the dots on the screen with your eyes and hover over each dot to calibrate. Keep your head completely still during calibration.
        </p>
        <button class="btn-start" id="btn-start-demo">Start Calibration</button>
        <p id="loading-msg" class="hidden" style="color: #f59e0b; margin-top: 20px; font-weight: bold;">Loading AI Models and requesting camera access... Please wait.</p>
    </div>

    <div id="calOverlay" class="hidden">
        <div class="cal-hud">
            <h3 style="margin:0 0 5px 0;">Look at each dot & Click</h3>
            <div id="calProgress" style="color: #2dd4bf; font-weight: bold;">0 / 9 dots</div>
        </div>
        <div id="calLayer"></div>
    </div>
    
    <div id="challengeOverlay" class="demo-container hidden">
        <h2 id="verdict-title">Verification Complete</h2>
        <p id="verdict-text" style="color: #94a3b8; font-size: 1.1rem; margin-top: 10px;"></p>
        <button class="btn-start" onclick="location.reload()" style="margin-top:20px;">Try Again</button>
    </div>

    <div id="gazeReticle"></div>

    <script src="webgazer.js"></script>
    <script src="demo_eye_tracking.js"></script>
</body>
</html>
